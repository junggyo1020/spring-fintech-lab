# 미션 PR을 Claude가 mission-review 스킬 기준으로 리뷰한다.
# 사전 준비(레포 관리자가 직접):
#   1) https://github.com/apps/claude 에서 이 레포에 Claude GitHub App 설치
#   2) 로컬에서 `claude setup-token` 실행 → 출력된 토큰을 레포 Settings > Secrets and variables > Actions에
#      CLAUDE_CODE_OAUTH_TOKEN 이름으로 등록 (Pro/Max 구독 사용량에서 차감)
# 동작:
#   - review: phase*/ 브랜치의 PR이 열리거나 Draft에서 Ready로 바뀌면 자동 리뷰 1회
#   - respond: 레포 소유자가 PR·이슈 댓글에 "@claude"를 쓰면 그 댓글에 답한다
#     (예: "@claude 수정했어, 지난 지적 1~3번 다시 봐줘")
name: Claude Mission Review

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  review:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft && startsWith(github.head_ref, 'phase')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            이 PR은 spring-fintech-lab 커리큘럼의 미션 제출이다.
            1. .claude/skills/mission-review/SKILL.md를 읽고 그 절차와 보고서 형식을 따른다.
            2. PR 본문의 "미션 문서" 링크가 가리키는 파일(phase-*/missions/M*-*.md)을 레포에서 읽는다.
            3. 변경 파일은 `gh pr diff`로 확인한다.
            4. 테스트 실행 단계는 PR 본문의 "테스트 결과" 절과 CI(ci.yml) 결과로 대신한다. 직접 실행하지 않는다.
            5. 정답 코드를 쓰지 않는다. 지적 1건 = 파일:줄 + 관찰 + 질문 1개.
               줄 단위 지적은 인라인 댓글로, 보고서 전체는 `gh pr comment`로 남긴다.
            6. Gemini Code Assist가 이미 남긴 줄 단위 지적과 같은 내용은 반복하지 않는다.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 30
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*)"

  respond:
    if: github.event_name != 'pull_request' && contains(github.event.comment.body, '@claude') && github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-opus-5-5
            --max-turns 20
            --append-system-prompt "spring-fintech-lab 학습 레포다. 코드 리뷰·힌트 요청은 .claude/skills/mission-review/SKILL.md 규칙을 따른다. 정답 코드를 쓰지 않고 파일:줄 + 관찰 + 질문으로 답한다. 코드를 커밋하거나 브랜치를 만들지 않는다."
            --allowedTools "Read,Glob,Grep,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*)"
