# 미션 PR을 Claude가 .claude/skills/mission-review/SKILL.md 기준으로 리뷰한다.
# 사전 준비(레포 관리자가 직접):
#   1) https://github.com/apps/claude 에서 이 레포에 Claude GitHub App 설치
#   2) 로컬 터미널에서 `claude setup-token` 실행, 출력된 토큰을 레포 Settings > Secrets and variables > Actions에
#      CLAUDE_CODE_OAUTH_TOKEN 이름으로 등록 (Pro/Max 구독 사용량에서 차감)
# 동작:
#   review: phase* 브랜치의 PR이 열리거나 Draft에서 Ready로 바뀌면 1회차 리뷰
#   respond: 레포 소유자가 PR, 이슈 댓글에 "@claude"를 쓰면 답한다
#            PR에서 "@claude 다시 리뷰"처럼 리뷰를 요청하면 이전 지적 대조표가 들어간 n회차 리뷰
#            질문 이슈에서는 mission-review 스킬 7절(힌트 요청) 형식으로 답한다
name: Claude Mission Review

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  review:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft && startsWith(github.head_ref, 'phase')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            spring-fintech-lab 커리큘럼의 미션 PR을 리뷰한다.
            1. .claude/skills/mission-review/SKILL.md와 .claude/skills/mission-review/references/writing-rules.md를 읽는다.
            2. SKILL.md 1절 표의 입력을 모은다. 미션 문서는 PR 본문 "미션 문서" 링크의 파일, 실행 결과는 PR 본문 "자동 점검 결과" 절과 `gh pr checks` 결과다. 테스트를 직접 실행하지 않는다.
            3. `gh pr view --comments`에서 이 스킬 형식의 이전 리뷰 보고서를 찾는다. 없으면 1회차, 있으면 n회차로 쓰고 5절 "이전 지적 대조" 표와 4절 힌트 단계를 적용한다. L3 Draft 단계에서 받은 시나리오 표 리뷰(6절)도 이전 리뷰로 센다.
            4. SKILL.md 2절 등급, 3절 지적 형식, 5절 보고서 형식으로 리뷰를 쓴다.
            5. 지적마다 해당 줄에 인라인 댓글을 남기고, 보고서 전체는 진행 상황 댓글에 쓴다.
            6. 보고서에 실행 환경, 도구 권한, 댓글 작성 방식 설명을 쓰지 않는다.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 30
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(gh issue view:*)"

  respond:
    if: github.event_name != 'pull_request' && contains(github.event.comment.body, '@claude') && github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-opus-5-5
            --max-turns 30
            --append-system-prompt "spring-fintech-lab 학습 레포다. 답하기 전에 .claude/skills/mission-review/SKILL.md와 references/writing-rules.md를 읽는다. PR에서 리뷰를 요청받으면 gh pr view --comments로 이전 리뷰 보고서를 찾아 회차를 정하고, SKILL.md 5절 형식에 '이전 지적 대조' 표와 4절 힌트 단계를 적용한다. PR 본문 '리뷰 반영 기록' 표를 대조 근거로 쓴다. L3 테스트 시나리오 표 리뷰 요청은 SKILL.md 6절을 따른다. 질문이나 힌트 요청은 SKILL.md 7절 형식으로 답한다. 정답 코드를 쓰지 않는다. 코드를 커밋하거나 브랜치를 만들지 않는다. 답에 실행 환경이나 도구 권한 설명을 쓰지 않는다."
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(gh issue view:*)"
