name: 미션 문서 오류 제보
description: 미션 문서의 기대값·명령어·설명이 틀렸거나, 학습자마다 다르게 구현할 수 있을 만큼 모호할 때 만든다.
title: "[문서] M?-? 오류 요약"
labels: ["doc-error"]
body:
  - type: input
    id: location
    attributes:
      label: 위치
      description: "파일 경로와 줄 번호. 예: phase-1-java-foundation/missions/M1-4-interest.md:53"
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: 심각도
      options:
        - 오류 (따라 하면 테스트가 멈추거나 틀린 값이 나온다)
        - 모호 (구현이 둘 이상으로 갈린다)
        - 표현 (추상 표현, 오타, 서식)
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 문제
      description: 문서에 적힌 내용과 실제로 관찰한 결과
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 근거
      description: 실행 결과, 계산식, 공식 문서 링크
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: 수정안
      description: 바꿀 문장을 그대로 적는다
    validations:
      required: false
